<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Detection App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { 
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        min-height: 100vh;
      }
    </style>
</head>
<body class="min-h-screen py-12 px-4">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 bg-black bg-opacity-80 text-white shadow-lg px-6 py-4 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-xl">DeepFake Detector</span>
            </div>
            <div class="flex space-x-4">
                <a href="/" class="px-3 py-2 text-gray-300 hover:text-white">Home</a>
                <a href="/predict" class="px-3 py-2 text-white bg-blue-600 rounded">Detect</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-20">

        <!-- FORM -->
        <div class="bg-black bg-opacity-75 p-8 rounded-xl shadow-2xl mb-8">
            <h1 class="text-3xl font-bold text-white text-center mb-6">
                Upload Image for Detection
            </h1>

            <form action="/predict" method="POST" enctype="multipart/form-data">

                <!-- DROP AREA -->
                <div id="drop-area" 
                     class="border-2 border-dashed border-gray-400 rounded-lg p-6 text-center cursor-pointer">

                    <p class="text-gray-300 text-lg mb-2">
                        Drag & Drop or Click to Upload
                    </p>

                    <input id="fileInput" type="file" name="file" required class="hidden">

                    <p id="file-name" class="text-gray-400 text-sm"></p>
                </div>

                <!-- BUTTON -->
                <div class="text-center mt-6">
                    <button type="submit"
                        class="py-3 px-8 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg">
                        Analyze Image
                    </button>
                </div>

            </form>
        </div>

        <!-- RESULTS -->
        {% if graph %}
        <div class="bg-black bg-opacity-75 p-8 rounded-xl shadow-2xl">
            <h2 class="text-2xl text-white text-center mb-6">Results</h2>

            <div class="flex flex-col md:flex-row justify-center gap-8">

                <img src="{{ url_for('static', filename='images/' + filename) }}" 
                     class="w-64 h-64 object-cover rounded">

                <img src="data:image/png;base64,{{ graph }}" 
                     class="w-64 rounded">
            </div>

            <div class="text-center mt-6">
                <h3 class="text-3xl font-bold text-white">{{ prediction }}</h3>
                <p class="text-gray-300 mt-2">
                    Real: {{ prob_real }}% | Fake: {{ prob_fake }}%
                </p>
            </div>
        </div>
        {% endif %}

    </div>

    <!-- JS (FIXED, SAFE) -->
    <script>
        const dropArea = document.getElementById("drop-area");
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("file-name");

        dropArea.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            fileName.textContent = fileInput.files[0].name;
        });

        dropArea.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        dropArea.addEventListener("drop", (e) => {
            e.preventDefault();
            fileInput.files = e.dataTransfer.files;
            fileName.textContent = e.dataTransfer.files[0].name;
        });
    </script>

</body>
</html>
